version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "Lambertyan"
    ignore:
      # Keep compatible with engine.node >=22
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      # Keep stable TypeScript — our strict config needs careful evaluation
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # Keep stable ESLint — our config is minimal
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
