name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality Gates (lint + typecheck + build + unit-test + coverage + benchmark) ───
  quality-node22:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  quality-node24:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '24'

  # ─── Browser compatibility (Playwright) ───
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:browser
      - run: npx playwright install chromium --with-deps
      - run: pnpm test:browser

  # ═══════════════════════════════════════════════════════════════════════
  # GitHub Pages — publish coverage + benchmark reports on push to master
  # ═══════════════════════════════════════════════════════════════════════
  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality-node22, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Download coverage artifact from quality job ────────────────────
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      # ── Download full benchmark report from benchmark-full workflow ────
      - name: Download full benchmark report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FULL_RUN=$(gh run list --repo AgentiX-E/drain-ts --workflow benchmark-full.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$FULL_RUN" ]; then
            echo "Downloading from run $FULL_RUN"
            DSETS="Proxifier Linux Apache Zookeeper Mac HealthApp Hadoop OpenStack HPC OpenSSH BGL Spark HDFS Thunderbird"
            COUNT=0
            mkdir -p benchmark-report/full /tmp/fb-results
            for ds in $DSETS; do
              gh run download "$FULL_RUN" --repo AgentiX-E/drain-ts --name "benchmark-full-${ds}" --dir "/tmp/fb-results" 2>/dev/null || true
            done
            {
              echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>drain-ts Loghub-2.0 Full Benchmark</title>'
              echo '<style>body{font-family:monospace;background:#0d1117;color:#c9d1d9;padding:2em}h1{color:#58a6ff}pre{background:#161b22;padding:1em;border-radius:6px;overflow-x:auto}a{color:#58a6ff}</style></head>'
              echo '<body><h1>drain-ts Loghub-2.0 Full Benchmark Report</h1><pre>'
            } > benchmark-report/full/index.html
            for f in /tmp/fb-results/bench-*.txt; do
              [ -f "$f" ] || continue
              cat "$f" >> benchmark-report/full/index.html
              COUNT=$((COUNT+1))
            done
            { echo "</pre><p>${COUNT} of 14 datasets</p>"
              echo '<p><a href="https://github.com/AgentiX-E/drain-ts/actions/workflows/benchmark-full.yml">Run History</a></p>'
              echo '</body></html>'
            } >> benchmark-report/full/index.html
            echo "Full report: $COUNT datasets"
          else
            echo "No benchmark-full run yet"
          fi

      # ── Generate Loghub-2k benchmark report ─────────────────────────────
      - name: Generate 2k benchmark report
        run: |
          npx tsx benchmark/run.ts --all 2>&1 | tee /tmp/bench-2k.txt

          mkdir -p benchmark-report/2k

          cat > benchmark-report/2k/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Loghub-2k Benchmark</title>
          <style>
            body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 2em; }
            h1 { color: #58a6ff; }
            pre { background: #161b22; padding: 1em; border-radius: 6px; overflow-x: auto; }
            .pass { color: #3fb950; } .fail { color: #f85149; }
            a { color: #58a6ff; }
          </style></head>
          <body>
          <h1>drain-ts Loghub-2k Benchmark Report</h1>
          <p>16 datasets, 2,000 messages each | Generated on $(date -u +"%Y-%m-%d %H:%M UTC")</p>
          <pre>
          HTMLEOF
          cat /tmp/bench-2k.txt >> benchmark-report/2k/index.html
          cat >> benchmark-report/2k/index.html << 'HTMLEOF'
          </pre>
          <p><a href="../">← Back to Reports</a></p>
          </body></html>
          HTMLEOF

          # If full report not yet available from artifact, create placeholder
          if [ ! -f benchmark-report/full/index.html ]; then
            mkdir -p benchmark-report/full
            cat > benchmark-report/full/index.html << 'HTMLEOF'
          <!DOCTYPE html><html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Loghub-2.0 Full Benchmark</title>
          <style>
            body{font-family:monospace;background:#0d1117;color:#c9d1d9;padding:2em}
            h1{color:#58a6ff}a{color:#58a6ff}
          </style></head>
          <body>
          <h1>drain-ts Loghub-2.0 Full Benchmark</h1>
          <p>Not yet available — run via <code>gh workflow run benchmark-full.yml -f datasets=all</code></p>
          <p><a href="https://github.com/AgentiX-E/drain-ts/actions/workflows/benchmark-full.yml">Run History</a></p>
          </body></html>
          HTMLEOF
          fi

          # --- Index page with relative links ---
          cat > benchmark-report/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Reports</title>
          <style>
            body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2em; }
            h1 { color: #58a6ff; }
            a { color: #58a6ff; display: block; margin: 0.5em 0; font-size: 1.2em; }
            .section { margin: 2em 0; }
            .section h2 { color: #8b949e; font-size: 1em; }
          </style></head>
          <body>
          <h1>drain-ts Reports</h1>
          <div class="section">
            <h2>Benchmarks</h2>
            <a href="2k/">Loghub-2k Benchmark (16 datasets × 2,000 messages)</a>
            <a href="full/">Loghub-2.0 Full Benchmark (CI smoke test)</a>
          </div>
          <div class="section">
            <h2>Coverage</h2>
            <a href="../coverage-report/">Test Coverage Report (vitest v8)</a>
          </div>
          <p><small>Automated by GitHub Actions | <a href="https://github.com/AgentiX-E/drain-ts">Source</a></small></p>
          </body></html>
          HTMLEOF

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
