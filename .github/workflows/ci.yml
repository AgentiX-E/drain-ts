name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality Gates (lint + typecheck + build + unit-test + coverage + benchmark) ───
  quality-node22:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  quality-node24:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '24'

  # ─── Browser compatibility (Playwright) ───
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:browser
      - run: npx playwright install chromium --with-deps
      - run: pnpm test:browser

  # ═══════════════════════════════════════════════════════════════════════
  # GitHub Pages — publish coverage + benchmark reports on push to master
  # ═══════════════════════════════════════════════════════════════════════
  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality-node22, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Download coverage artifact from quality job ────────────────────
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      # ── Download full benchmark report ──────────────────────────────────
      - name: Download full benchmark report
        uses: actions/download-artifact@v4
        with:
          name: full-benchmark-report
          path: benchmark-report/full
        continue-on-error: true

      # ── Generate benchmark HTML reports (2k + full) ───────────────────
      - name: Generate benchmark reports
        run: |
          # --- Loghub-2k Benchmark ---
          npx tsx benchmark/run.ts --all 2>&1 | tee /tmp/bench-2k.txt

          mkdir -p benchmark-report/2k

          cat > benchmark-report/2k/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Loghub-2k Benchmark</title>
          <style>
            body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 2em; }
            h1 { color: #58a6ff; }
            pre { background: #161b22; padding: 1em; border-radius: 6px; overflow-x: auto; }
            .pass { color: #3fb950; } .fail { color: #f85149; }
            a { color: #58a6ff; }
          </style></head>
          <body>
          <h1>drain-ts Loghub-2k Benchmark Report</h1>
          <p>16 datasets, 2,000 messages each | Generated on $(date -u +"%Y-%m-%d %H:%M UTC")</p>
          <pre>
          HTMLEOF
          cat /tmp/bench-2k.txt >> benchmark-report/2k/index.html
          cat >> benchmark-report/2k/index.html << 'HTMLEOF'
          </pre>
          <p><a href="../">← Back to Reports</a></p>
          </body></html>
          HTMLEOF

          # --- Loghub-2.0 Full Benchmark (smoke) ---
          npx tsx benchmark/run-full.ts --smoke 2>&1 | tee /tmp/bench-full.txt

          mkdir -p benchmark-report/full

          cat > benchmark-report/full/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Loghub-2.0 Full Benchmark</title>
          <style>
            body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 2em; }
            h1 { color: #58a6ff; }
            pre { background: #161b22; padding: 1em; border-radius: 6px; overflow-x: auto; }
            a { color: #58a6ff; }
            .note { background: #1f2937; padding: 1em; border-radius: 6px; border-left: 3px solid #58a6ff; }
          </style></head>
          <body>
          <h1>drain-ts Loghub-2.0 Full Dataset Benchmark</h1>
          <div class="note">
          <strong>Smoke test mode</strong> — CI runs a smoke test with the 2k Proxifier dataset.<br>
          For full 3.6M-msg/dataset benchmarks, run locally with <code>npx tsx benchmark/run-full.ts --all</code>.<br>
          Requires ~100GB storage and ~16GB RAM.
          </div>
          <pre>
          HTMLEOF
          cat /tmp/bench-full.txt >> benchmark-report/full/index.html
          cat >> benchmark-report/full/index.html << 'HTMLEOF'
          </pre>
          <p><a href="../">← Back to Reports</a></p>
          </body></html>
          HTMLEOF

          # --- Index page with relative links ---
          cat > benchmark-report/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>drain-ts Reports</title>
          <style>
            body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2em; }
            h1 { color: #58a6ff; }
            a { color: #58a6ff; display: block; margin: 0.5em 0; font-size: 1.2em; }
            .section { margin: 2em 0; }
            .section h2 { color: #8b949e; font-size: 1em; }
          </style></head>
          <body>
          <h1>drain-ts Reports</h1>
          <div class="section">
            <h2>Benchmarks</h2>
            <a href="2k/">Loghub-2k Benchmark (16 datasets × 2,000 messages)</a>
            <a href="full/">Loghub-2.0 Full Benchmark (CI smoke test)</a>
          </div>
          <div class="section">
            <h2>Coverage</h2>
            <a href="../coverage-report/">Test Coverage Report (vitest v8)</a>
          </div>
          <p><small>Automated by GitHub Actions | <a href="https://github.com/AgentiX-E/drain-ts">Source</a></small></p>
          </body></html>
          HTMLEOF

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
