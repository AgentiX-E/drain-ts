name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality Gates (lint + typecheck + build + unit-test + coverage) ───
  quality-node22:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  quality-node24:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '24'

  # ─── Browser compatibility (Playwright) ───
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:browser
      - run: npx playwright install chromium --with-deps
      - run: pnpm test:browser

  # ═══════════════════════════════════════════════════════════════════════
  # GitHub Pages — publish docs + coverage + benchmark on push to master
  # ═══════════════════════════════════════════════════════════════════════
  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality-node22, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Generate benchmark report ──────────────────────────────────────
      - name: Generate benchmark report (HDFS smoke + summary)
        run: |
          npx tsx benchmark/run.ts --all 2>&1 | tee /tmp/bench-full.txt
          mkdir -p docs/benchmark
          # Create benchmark HTML from template
          cat > docs/benchmark/index.html << 'BENCHHTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <title>drain-ts Benchmark — Loghub 2k</title>
          <style>body{font-family:-apple-system,system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}
          table{border-collapse:collapse;width:100%;margin:1rem 0}
          th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #ddd}
          th{background:#f5f5f5;font-weight:600}
          td:first-child,th:first-child{text-align:left}
          .pass{color:#22863a}.fail{color:#cb2431}
          pre{background:#f5f5f5;padding:1rem;border-radius:6px;overflow-x:auto}
          </style></head><body><h1>drain-ts Benchmark Report</h1>
          <p>Generated by CI. All 15 Loghub 2k datasets.</p>
          <pre id="output">Loading...</pre>
          <p><small>Generated: <span id="date"></span></small></p>
          <script>document.getElementById("date").textContent=new Date().toISOString()
          fetch("output.txt").then(r=>r.text()).then(t=>document.getElementById("output").textContent=t)</script>
          </body></html>
          BENCHHTML
          cp /tmp/bench-full.txt docs/benchmark/output.txt

      # ── Download coverage artifact from quality job ───────────────────
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage
        continue-on-error: true

      # ── Deploy to GitHub Pages ────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
