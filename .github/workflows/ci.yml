name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality Gates (lint + typecheck + build + unit-test + coverage) ───
  quality-node22:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  quality-node24:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '24'

  # ─── Browser compatibility (Playwright) ───
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:browser
      - run: npx playwright install chromium --with-deps
      - run: pnpm test:browser

  # ═══════════════════════════════════════════════════════════════════════
  # GitHub Pages — publish docs + coverage + benchmark on push to master
  # ═══════════════════════════════════════════════════════════════════════
  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality-node22, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ── Generate benchmark report ──────────────────────────────────────
      - name: Generate benchmark report (HDFS smoke + summary)
        run: |
          npx tsx benchmark/run.ts --all 2>&1 | tee /tmp/bench-full.txt
          mkdir -p benchmark-report
          cp /tmp/bench-full.txt benchmark-report/output.txt

      # ── Download coverage artifact from quality job ───────────────────
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
        continue-on-error: true

      # ── Deploy to GitHub Pages ────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
