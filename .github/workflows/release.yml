name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Quality Gates ────────────────────────────────────────────────
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'

  # ─── npm Publish (OIDC Trusted Publisher) ─────────────────────────
  publish:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --access public --provenance

  # ─── GitHub Release ───────────────────────────────────────────────
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="${{ inputs.version }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "No tag or version input found"
            exit 1
          fi

          # Extract changelog entry for this version (between version headers)
          CHANGELOG=$(sed -n "/## \[${TAG_NAME#v}\]/,/## \[/p" CHANGELOG.md | sed '$d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/AgentiX-E/drain-ts/blob/master/CHANGELOG.md) for details."
          fi

          gh release create "$TAG_NAME" \
            --title "drain-ts $TAG_NAME" \
            --notes "$CHANGELOG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
